<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8edf4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lighthouse">
  <title>LightHouse · 홈</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/voice/home.css">
  <link rel="stylesheet" href="/voice/requests.css">
  <script src="/voice/requests.js" defer></script>
</head>
<body>
  <main class="shell">
    <section class="screen home active" id="home" aria-labelledby="home-title">
      <h1 class="sr-only" id="home-title" tabindex="-1">LightHouse 상품 요청 서비스</h1>
      <p class="home-lead">상품을 요청하거나 내 구매 요청 목록을 확인할 수 있어요.</p>
      <div class="home-choices">
        <a class="home-choice" href="/request" aria-labelledby="new-request-title" aria-describedby="new-request-help">
          <span class="home-choice-name" id="new-request-title">상품 요청</span>
          <span class="home-choice-help" id="new-request-help">AI와 음성으로 대화해 원하는 상품을 봉사자에게 요청할 수 있어요.</span>
        </a>
        <button class="home-choice home-choice-list" type="button" data-screen="list" aria-labelledby="request-list-title" aria-describedby="request-list-help">
          <span class="home-choice-name" id="request-list-title">내 구매 요청 목록</span>
          <span class="home-choice-help" id="request-list-help">요청한 상품의 진행 상황과 봉사자 리뷰를 확인할 수 있어요.</span>
        </button>
      </div>
    </section>

    <section class="screen requests-screen" id="list" aria-labelledby="list-title" hidden>
      <h1 id="list-title" tabindex="-1">내 구매 요청 목록</h1>
      <button class="request-back" type="button" data-screen="home">뒤로 돌아가기</button>
      <p id="list-live" class="sr-only" role="status"></p>
      <p id="requests-empty" class="requests-empty" hidden></p>
      <div id="requests" class="request-list"></div>
      <div class="request-tools">
        <button class="request-action request-secondary" id="push-btn" type="button">리뷰가 오면 알림 받기</button>
        <a class="request-action" href="/request">새 구매 요청</a>
      </div>
    </section>

    <section class="screen requests-screen" id="details" aria-labelledby="details-title" hidden>
      <h1 id="details-title" tabindex="-1">내 요청 사항 확인</h1>
      <button class="request-back" type="button" data-screen="list">뒤로 돌아가기</button>
      <article class="request-detail" aria-labelledby="details-product">
        <h2 id="details-product"></h2>
        <p class="request-status" id="details-status"></p>
        <p id="details-message"></p>
        <dl class="request-facts" id="details-facts"></dl>
      </article>
    </section>

    <section class="screen requests-screen" id="review" aria-labelledby="review-title" hidden>
      <h1 id="review-title" tabindex="-1">봉사자 응답 확인</h1>
      <button class="request-back" type="button" data-screen="list">뒤로 돌아가기</button>
      <article class="request-detail" aria-label="봉사자 리뷰">
        <h2 id="review-product"></h2>
        <p id="review-meta" class="review-meta" hidden></p>
        <section class="review-part" aria-labelledby="review-text-title">
          <h3 id="review-text-title">검수를 마친 리뷰</h3>
          <p id="review-text" tabindex="-1"></p>
        </section>
        <section class="review-part" aria-labelledby="review-experience-title" id="review-experience" hidden>
          <h3 id="review-experience-title">봉사자의 직접 사용 경험</h3>
          <p id="review-experience-text"></p>
        </section>
        <section class="review-part" aria-labelledby="review-research-title" id="review-research" hidden>
          <h3 id="review-research-title">조사 정보</h3>
          <dl class="request-facts" id="review-research-facts"></dl>
        </section>
        <p class="review-notice" id="review-notice" hidden>상품 정보와 판매 조건은 달라질 수 있습니다.</p>
      </article>
      <div class="review-links" id="review-links"></div>
    </section>
  </main>
</body>
</html>
