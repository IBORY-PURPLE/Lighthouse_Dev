<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비전 AI 실험실</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e2dc; --accent:#1f5fbf; --warn:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  .row { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; }
  label { display:inline-flex; gap:6px; align-items:center; }
  input[type=number] { width:80px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .status { font-size:13px; color:var(--muted); }
  .status.bad { color:var(--warn); }
  .batch { display:grid; grid-template-columns: 280px 1fr; gap:16px; }
  @media (max-width:760px) { .batch { grid-template-columns:1fr; } }
  .thumbs { display:flex; flex-direction:column; gap:8px; max-height:620px; overflow:auto; }
  .thumbs img { width:100%; border:1px solid var(--line); border-radius:6px; cursor:zoom-in; background:#fff; }
  .meta { font-size:12px; color:var(--muted); margin-top:2px; }
  pre { white-space:pre-wrap; word-break:break-word; margin:0; font:14px/1.6 inherit; font-family:inherit; }
  .err { color:var(--warn); }
  h2 { font-size:16px; margin:0 0 8px; }
  dialog { max-width:95vw; max-height:95vh; padding:0; border:none; }
  dialog img { display:block; max-width:95vw; }
</style>
</head>
<body>
<main>
  <h1>비전 AI 실험실</h1>
  <p class="sub">상세 이미지를 올리면 고른 엔진(OpenAI luna · Upstage OCR · Groq qwen)이 읽은 결과를 이미지 옆에 보여 줍니다. 로컬 실험용이며 이미지는 저장하지 않습니다.</p>

  <section class="panel">
    <div class="row">
      <input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple>
      <button id="sample" type="button">예시 이미지 만들기</button>
      <span id="status" class="status">서버 확인 중…</span>
    </div>
    <div class="row" style="margin-top:12px">
      <label>보내는 방법
        <select id="mode">
          <option value="whole">통째로(이미지 1장 = 1장)</option>
          <option value="tiles">잘라서(타일)</option>
        </select>
      </label>
      <label>엔진
        <select id="engine">
          <option value="openai">OpenAI luna(유료)</option>
          <option value="upstage">Upstage OCR(유료)</option>
          <option value="groq">Groq qwen(무료 기준선)</option>
        </select>
      </label>
      <label>지시
        <select id="kind">
          <option value="summary">항목 요약</option>
          <option value="ocr">글자 그대로 읽기</option>
        </select>
      </label>
      <label>최대 폭(px) <input id="maxWidth" type="number" value="1000" min="256" step="8"></label>
      <label>타일 높이(px)
        <select id="tileHeight">
          <option value="1200">1200</option>
          <option value="800">800</option>
          <option value="1400">1400(이전 기본)</option>
        </select>
      </label>
      <label>겹침(px) <input id="overlap" type="number" value="100" min="0" step="10"></label>
      <label><input id="summarize" type="checkbox" checked> 읽은 글자로 항목 요약(Groq gpt-oss)</label>
      <button id="run" class="primary" type="button" disabled>분석하기</button>
    </div>
    <p class="meta">요청당 이미지 1장(조각 1장 = 호출 1회)으로 보냅니다. 이전 값(폭 1024·겹침 80)도 입력으로 고를 수 있습니다. 엔진당 유료 호출은 서버가 500장에서 거부합니다. iPhone HEIC 사진은 PNG/JPEG로 바꿔 올려 주세요.</p>
    <p id="calls" class="meta"></p>
    <button id="download" type="button" disabled>결과 내려받기</button>
  </section>

  <section id="results"></section>
</main>
<dialog id="zoom"><img alt="확대 이미지"></dialog>

<script>
const $ = (id) => document.getElementById(id);
let sampleFile = null;
let keyOk = false;

let lastResult = null;
function showCalls(c) { if (c) $("calls").textContent = `호출 누계(이 서버 실행): luna ${c.openai} · Upstage ${c.upstage} · qwen ${c.groqQwen} · gpt-oss ${c.groqOss}`; }
fetch("/api/status").then((r) => r.json()).then((s) => {
  keyOk = s.keyConfigured || s.openaiKeyConfigured || s.upstageKeyConfigured;
  $("status").textContent = `키: Groq ${s.keyConfigured ? "있음" : "없음"} · OpenAI ${s.openaiKeyConfigured ? "있음" : "없음"} · Upstage ${s.upstageKeyConfigured ? "있음" : "없음"} · luna 모델 ${s.models.openai}`;
  $("status").classList.toggle("bad", !keyOk);
  showCalls(s.calls);
  updateRunButton();
}).catch(() => { $("status").textContent = "서버 연결 실패"; $("status").classList.add("bad"); });

function selectedFiles() {
  const files = [...$("files").files];
  return files.length ? files : sampleFile ? [sampleFile] : [];
}
function updateRunButton() { $("run").disabled = !keyOk || selectedFiles().length === 0; }
$("files").addEventListener("change", () => { sampleFile = null; updateRunButton(); });

function toJpeg(source, sx, sy, sw, sh, scale) {
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(sw * scale);
  canvas.height = Math.round(sh * scale);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(source, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return { url: canvas.toDataURL("image/jpeg", 0.85), w: canvas.width, h: canvas.height };
}

async function prepare(file, mode, maxWidth, tileHeight, overlapPx = 100) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxWidth / bmp.width);
  const out = [];
  if (mode === "whole") {
    out.push({ ...toJpeg(bmp, 0, 0, bmp.width, bmp.height, scale), label: `${file.name} 전체` });
  } else {
    const srcTile = Math.round(tileHeight / scale);
    const overlap = Math.round(overlapPx / scale);
    let y = 0, i = 1;
    while (y < bmp.height) {
      let h = Math.min(srcTile, bmp.height - y);
      // 끝에 타일 높이의 40%보다 작게 남으면 따로 보내지 않고 이 조각에 붙인다.
      if (bmp.height - (y + h) > 0 && bmp.height - (y + h) < srcTile * 0.4) h = bmp.height - y;
      out.push({ ...toJpeg(bmp, 0, y, bmp.width, h, scale), label: `${file.name} 조각 ${i++}` });
      if (y + h >= bmp.height) break;
      y += srcTile - overlap;
    }
  }
  out.forEach((o) => { o.orig = `${bmp.width}×${bmp.height}`; o.kb = Math.round(o.url.length * 0.75 / 1024); });
  return out;
}

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  Object.assign(node, attrs);
  if (text !== undefined) node.textContent = text;
  return node;
}

async function postJson(url, body) {
  let res, data;
  for (let attempt = 0; attempt < 4; attempt++) {
    res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    data = await res.json();
    if (res.status !== 429 || !data.retryAfterSec) break;
    await new Promise((r) => setTimeout(r, data.retryAfterSec * 1000));
  }
  return { ok: res.ok, status: res.status, data };
}

// 조각 경계의 겹친 줄을 한 번만 남긴다(앞 조각의 마지막 줄들과 같은 줄은 뺀다).
function joinTexts(texts) {
  const out = [];
  for (const t of texts) {
    const lines = t.split(/\r?\n/);
    const tail = new Set(out.slice(-8).map((l) => l.trim()).filter(Boolean));
    let i = 0;
    while (i < lines.length && (lines[i].trim() === "" || tail.has(lines[i].trim()))) i++;
    out.push(...lines.slice(i));
  }
  return out.join("\n");
}

// 이미지 조각을 엔진에 1장씩 보내 글자를 읽고, 이어 붙인 글자를 요약 단계에 넘긴다. run.mjs도 이 함수를 쓴다.
async function runAnalysis({ files, mode, kind, engine, maxWidth, tileHeight, overlap, summarize, onTile }) {
  const tiles = [];
  for (const f of files) tiles.push(...await prepare(f, mode, maxWidth, tileHeight, overlap));
  const results = [];
  for (const [i, tile] of tiles.entries()) {
    const r = await postJson("/api/analyze", { images: [tile.url], kind, engine });
    const { text, ...rest } = r.data;
    results.push({ label: tile.label, w: tile.w, h: tile.h, kb: tile.kb, ok: r.ok, status: r.status, text: text ?? "", ...rest });
    onTile?.(tile, r, i, tiles.length);
    if (i < tiles.length - 1) await new Promise((res) => setTimeout(res, 1000));
  }
  const text = joinTexts(results.filter((r) => r.ok).map((r) => r.text));
  let summary = null;
  if (summarize && text.trim()) {
    const r = await postJson("/api/summarize-text", { text });
    summary = { ok: r.ok, status: r.status, ...r.data };
  }
  return {
    engine, mode, kind, maxWidth, tileHeight: mode === "tiles" ? tileHeight : null, overlap,
    tiles: results.length, failed: results.filter((r) => !r.ok).length,
    readMs: results.reduce((a, r) => a + (r.ms ?? 0), 0), tileMs: results.map((r) => r.ms ?? null),
    pages: results.reduce((a, r) => a + (r.pages ?? 0), 0) || null,
    results, text, summary,
  };
}

$("run").addEventListener("click", async () => {
  const opts = {
    files: selectedFiles(), mode: $("mode").value, kind: $("kind").value, engine: $("engine").value,
    maxWidth: Number($("maxWidth").value), tileHeight: Number($("tileHeight").value), overlap: Number($("overlap").value),
    summarize: $("summarize").checked,
  };
  $("run").disabled = true;
  $("results").replaceChildren();
  try {
    const result = await runAnalysis({
      ...opts,
      onTile(tile, r, i, n) {
        const card = el("section", { className: "panel" });
        card.append(el("h2", {}, `조각 ${i + 1}/${n} · ${opts.engine} · ${opts.mode === "whole" ? "통째로" : `타일 ${opts.tileHeight}`}`));
        const grid = el("div", { className: "batch" });
        const thumbs = el("div", { className: "thumbs" });
        const im = el("img", { src: tile.url, alt: tile.label });
        im.addEventListener("click", () => { $("zoom").querySelector("img").src = tile.url; $("zoom").showModal(); });
        thumbs.append(im, el("div", { className: "meta" }, `${tile.label} · 원본 ${tile.orig} → 보냄 ${tile.w}×${tile.h} · ${tile.kb}KB`));
        const out = el("div");
        const d = r.data;
        out.append(el("pre", r.ok ? {} : { className: "err" }, r.ok ? d.text || "(빈 답변)" : `실패: ${d.error}`));
        if (r.ok) out.append(el("p", { className: "meta" }, `${d.model} · ${(d.ms / 1000).toFixed(1)}초 · 입력 ${d.usage?.prompt_tokens ?? "?"} / 출력 ${d.usage?.completion_tokens ?? "?"} 토큰${d.pages ? ` · usage.pages ${d.pages}` : ""}${d.notes?.length ? ` · ${d.notes.join("; ")}` : ""}`));
        showCalls(d.calls);
        grid.append(thumbs, out);
        card.append(grid);
        $("results").append(card);
      },
    });
    const card = el("section", { className: "panel" });
    card.append(el("h2", {}, `합계 · 조각 ${result.tiles}장 · 글자 읽기 ${(result.readMs / 1000).toFixed(1)}초`));
    if (result.summary?.ok) {
      showCalls(result.summary.calls);
      card.append(el("p", { className: "meta" }, `요약 ${result.summary.model} · ${(result.summary.ms / 1000).toFixed(1)}초`));
      for (const f of result.summary.fields) {
        const mark = f.check === "verified" ? "근거 확인" : f.check === "unverified" ? "확인 안 됨(근거가 원문에 없음)" : "이미지에서 못 찾음";
        card.append(el("p", {}, `${f.key}: ${f.value ?? "—"} · ${mark}`));
      }
    } else if (result.summary) {
      card.append(el("p", { className: "err" }, `요약 실패: ${result.summary.error}`));
    }
    $("results").append(card);
    lastResult = result;
    $("download").disabled = false;
  } catch (e) {
    $("results").append(el("p", { className: "err" }, `오류: ${e.message}`));
  } finally {
    updateRunButton();
  }
});
// 사람이 눈으로 볼 때용. 브라우저 기본 다운로드 폴더에 저장되며 서버는 파일을 쓰지 않는다.
$("download").addEventListener("click", () => {
  if (!lastResult) return;
  const a = el("a", { href: URL.createObjectURL(new Blob([JSON.stringify(lastResult, null, 2)], { type: "application/json" })), download: "vision-result.json" });
  a.click();
});
$("zoom").addEventListener("click", () => $("zoom").close());

// 시험용 합성 상세 이미지(세로로 긴 쇼핑몰 상세 이미지 흉내). 실제 상품 아님.
function makeSampleCanvas() {
  const c = document.createElement("canvas");
  c.width = 860; c.height = 4200;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  const blocks = [
    ["#111", 54, "라이트하우스 무선 헤드셋 LH-200"],
    ["#555", 28, "블루투스 5.4 · 노이즈 캔슬링 · 최대 40시간 재생"],
    ["#000", 34, "색상 옵션: 블랙 / 화이트 / 네이비"],
    ["#000", 30, "• 드라이버: 40mm 다이나믹"],
    ["#000", 30, "• 무게: 250g"],
    ["#000", 30, "• 충전 단자: USB-C, 10분 충전 시 5시간 사용"],
    ["#000", 30, "• 지원 코덱: SBC, AAC"],
    ["#000", 34, "구성품: 본체, USB-C 케이블, 휴대용 파우치, 설명서"],
    ["#b3261e", 26, "주의: 귀에 이상이 느껴지면 즉시 사용을 중단하세요."],
    ["#b3261e", 22, "※ 방수 기능이 없습니다. 비나 물에 닿지 않게 하세요."],
    ["#999", 18, "작은 글씨 테스트: 본 제품은 KC 인증(R-C-LHX-LH200)을 받았습니다."],
  ];
  let y = 120;
  for (const [color, size, text] of blocks) {
    g.fillStyle = color; g.font = `${size >= 34 ? "bold " : ""}${size}px sans-serif`;
    g.fillText(text, 40, y);
    y += 340;
  }
  return c;
}
function makeSampleFile() {
  return new Promise((resolve) => makeSampleCanvas().toBlob((blob) => resolve(new File([blob], "sample-headset.png", { type: "image/png" })), "image/png"));
}
window.visionLab = { prepare, runAnalysis, makeSampleFile };
$("sample").addEventListener("click", () => {
  const c = makeSampleCanvas();
  c.toBlob((blob) => {
    sampleFile = new File([blob], "sample-headset.png", { type: "image/png" });
    $("files").value = "";
    $("status").textContent += " · 예시 이미지 준비됨(860×4200)";
    updateRunButton();
  }, "image/png");
});
</script>
</body>
</html>
