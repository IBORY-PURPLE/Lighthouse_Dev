# PR과 main 푸시마다 웹 앱 검사(lint, 타입 검사, 단위 시험)를 GitHub의 깨끗한 환경에서 돌린다.
# 이유: 지금은 구현한 쪽(Claude)이 로컬 PC에서 시험을 돌려 기록을 남기고, Codex는 그 기록만 읽는다
#       (.claude/rules/pr-flow.md "Codex 검증"). 만든 쪽 PC에 기대지 않는 실행 결과를 커밋마다 남긴다.
# 범위: `npm run check`와 같은 세 명령만 돌린다. 화면 시험(Playwright)과 실제 AI 호출 시험은 넣지 않았다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 저장소를 읽기만 한다. 비밀 값은 쓰지 않는다.
permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 앞선 실행은 멈춘다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (lint, typecheck, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 버전은 package.json의 engines(22.x)를 따른다. Vercel과 같은 기준이다.
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/package.json
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: lint
        run: npm run lint

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 시험
        run: npm run test:unit
